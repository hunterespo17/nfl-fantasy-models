name: Build & deploy the draft board

# ── When the website rebuilds itself ─────────────────────────────────────────
on:
  schedule:
    - cron: '23 11 * * *'   # every day ~11:23 UTC (early morning in the US)
  push:
    branches: [ main ]      # any push to main rebuilds the site
  workflow_dispatch: {}     # adds a manual "Run workflow" button in the Actions tab

# ── Permissions the GitHub Pages deploy needs ────────────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# ── Never run two deploys at once ────────────────────────────────────────────
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fresh nflverse stats and schedules each run -- this is what keeps the
      # board current without you touching anything.
      - name: Pull fresh nflverse data
        run: python scripts/01_pull_data.py --refresh

      # Live draft prices from ESPN. A site being down must never stop the
      # deploy, so this is allowed to fail and the committed prices in
      # data/adp.csv are the floor.
      - name: Refresh draft prices (optional)
        continue-on-error: true
        run: python scripts/15_pull_adp.py

      - name: Build the quarterback board
        run: python scripts/06_build_qb_model.py

      # NOT optional on purpose. If the running backs can't build, the run goes
      # red and you find out today. The site that's already live stays up.
      - name: Build the running-back board
        run: python scripts/11_build_rb_model.py

      # Folds every position that built into ONE page with a tab each.
      - name: Assemble the one-page site
        run: python scripts/12_build_site.py

      # Nice-to-have historical page. If it errors, the board still deploys.
      - name: Build the backtest page (optional)
        continue-on-error: true
        run: python scripts/07_backtest_qb.py

      - name: Collect the files Pages will serve
        run: |
          mkdir -p site
          cp outputs/index.html site/index.html
          if [ -f outputs/qb_backtest.html ]; then cp outputs/qb_backtest.html site/backtest.html; fi

      # Cheap insurance against the exact failure this workflow used to have:
      # a page that deployed happily with only quarterbacks on it.
      - name: Sanity-check the page
        run: |
          test -s site/index.html || { echo "::error::index.html is missing or empty"; exit 1; }
          for p in "Quarterback" "Running back"; do
            if ! grep -q "\"long\": \"$p\"" site/index.html; then
              echo "::error::No $p board made it onto the page"; exit 1
            fi
          done
          # "ADP" on its own is what a board prints when it had no prices at all
          # and fell back to repeating its own ranking. That is the exact failure
          # this check exists to catch -- usually data/adp.csv not being committed.
          if grep -q '"adp_source": "ADP"' site/index.html; then
            echo "::error::A board built with no draft prices. Check data/adp.csv is committed."; exit 1
          fi
          echo "Page is $(wc -c < site/index.html) bytes -- QB and RB boards, both priced."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
