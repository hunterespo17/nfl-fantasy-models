name: Build & deploy the boards

# ── When to rebuild the board ────────────────────────────────────────────────
on:
  schedule:
    - cron: '23 11 * * *'   # every day ~11:23 UTC (early morning in the US). Change to taste.
  push:
    branches: [ main ]      # any push to main (e.g. after you paste fresh ADP) rebuilds
  workflow_dispatch: {}     # adds a manual "Run workflow" button in the Actions tab

# ── Permissions the GitHub Pages deploy needs ────────────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# ── Never run two deploys at once ────────────────────────────────────────────
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fetches fresh nflverse stats/schedules each run — this is what keeps the
      # board current. (ADP + win totals come from the committed CSVs in data/.)
      - name: Pull fresh nflverse data
        run: python scripts/01_pull_data.py --refresh

      # The RB board runs FIRST and is allowed to fail. It is newer than the QB
      # board and leans on depth charts and snap counts that can be thin in the
      # offseason; a bad day for the backs must never take the QB board — the
      # page you actually draft from — off the internet.
      - name: Build the RB board (optional)
        continue-on-error: true
        run: python scripts/11_build_rb_model.py

      - name: Did the RB board build?
        run: |
          if [ -s outputs/boards/rb.json ]; then
            echo "RB board saved, $(wc -c < outputs/boards/rb.json) bytes"
          else
            echo "::warning::RB board did not build — deploying without the RB tab."
          fi

      - name: Build the QB board
        run: python scripts/06_build_qb_model.py

      # Folds every position that built into ONE page with a tab each, plus the
      # Big Board and How-it-works. A position that failed above simply has no
      # saved board, so it gets no tab and the rest of the page is unaffected.
      - name: Put every position on one page
        run: python scripts/12_build_site.py

      # Nice-to-have historical page. If it errors, the board still deploys.
      - name: Build the backtest page (optional)
        continue-on-error: true
        run: python scripts/07_backtest_qb.py

      - name: Assemble the site
        run: |
          mkdir -p site
          if [ -s outputs/index.html ]; then
            cp outputs/index.html site/index.html
          else
            echo "::warning::Combined page missing — falling back to the QB board alone."
            cp outputs/qb_model.html site/index.html
          fi
          # Old bookmark insurance: the boards used to live at these addresses.
          # They are single-position pages now, not linked from anywhere.
          if [ -f outputs/qb_model.html ]; then cp outputs/qb_model.html site/qb.html; fi
          if [ -f outputs/rb_model.html ]; then cp outputs/rb_model.html site/rb.html; fi
          if [ -f outputs/qb_backtest.html ]; then cp outputs/qb_backtest.html site/backtest.html; fi

      - name: Sanity-check the board built
        run: |
          test -s site/index.html || { echo "::error::Board HTML is missing or empty"; exit 1; }
          echo "Site page is $(wc -c < site/index.html) bytes"
          grep -q '"boards"' site/index.html || { echo "::error::Page has no board data"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
